url: https://mikenguyen13.github.io/regsensitivity/
template:
  bootstrap: 5
  includes:
    # Structured data so search engines and AI tools can identify the
    # package, and the styles of the AI-assistant box in the home sidebar.
    in_header: |
      <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareSourceCode",
        "name": "regsensitivity",
        "alternateName": "Regression Sensitivity Analysis for Omitted Variable Bias",
        "description": "R package for sensitivity analysis of regression coefficients to omitted variables: identified sets and breakdown points of Diegert, Masten and Poirier (endogenous controls), Oster's (2019) delta, and Masten and Poirier's (2026) bounds, with bootstrap intervals and plots.",
        "url": "https://mikenguyen13.github.io/regsensitivity/",
        "codeRepository": "https://github.com/mikenguyen13/regsensitivity",
        "programmingLanguage": {"@type": "ComputerLanguage", "name": "R"},
        "runtimePlatform": "R",
        "license": "https://opensource.org/licenses/MIT",
        "image": "https://mikenguyen13.github.io/regsensitivity/logo.png",
        "author": {
          "@type": "Person",
          "name": "Mike Nguyen",
          "identifier": "https://orcid.org/0000-0002-3432-8595"
        }
      }
      </script>
      <style>
      .rs-box{font-size:.9em;border:1px solid var(--bs-border-color,#dee2e6);border-radius:6px;padding:.75em 1em;margin:0 0 1em}
      .rs-box p{margin-bottom:.5em}
      .rs-box pre{font-size:.85em;margin-bottom:.5em;white-space:pre-wrap;overflow-wrap:anywhere}
      .rs-box .rs-install img{height:20px;margin:0 .25rem .25rem 0}
      </style>

home:
  title: "regsensitivity: Sensitivity Analysis for Omitted Variable Bias in R"
  description: >
    Bounds and breakdown points for regression coefficients under omitted
    variable bias in R, allowing the controls themselves to be endogenous
    (Diegert, Masten and Poirier), with Oster's delta and Masten-Poirier
    bounds, bootstrap intervals, plots, and a Stata crosswalk.
  sidebar:
    structure: [ai, links, license, community, citation, authors, dev]
    components:
      ai:
        title: Use with your AI assistant
        text: |
          <div class="rs-box">
          <p>Ask Claude, Cursor, VS Code, or ChatGPT how to run and read these analyses, with answers that cite the documentation.</p>
          <div class="sourceCode"><pre><code>https://research-methods-mcp.vercel.app/mcp?src=book-regsensitivity</code></pre></div>
          <p class="rs-install"><a href="https://cursor.com/en/install-mcp?name=research-methods&amp;config=eyJ1cmwiOiJodHRwczovL3Jlc2VhcmNoLW1ldGhvZHMtbWNwLnZlcmNlbC5hcHAvbWNwP3NyYz1ib29rLXJlZ3NlbnNpdGl2aXR5In0%3D"><img src="https://cursor.com/deeplink/mcp-install-dark.svg" alt="Add to Cursor"></a><a href="https://insiders.vscode.dev/redirect/mcp/install?name=research-methods&amp;config=%7B%22type%22%3A%22http%22%2C%22url%22%3A%22https%3A%2F%2Fresearch-methods-mcp.vercel.app%2Fmcp%3Fsrc%3Dbook-regsensitivity%22%7D"><img src="https://img.shields.io/badge/VS_Code-Install_server-0098FF?logo=visualstudiocode&amp;logoColor=white" alt="Install in VS Code"></a></p>
          <p><a href="https://research-methods-mcp.vercel.app/">Setup for other clients</a></p>
          </div>

