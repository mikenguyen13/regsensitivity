    href: https://orcid.org/0000-0002-3432-8595

reference:
  - title: "Main analyses"
    contents:
      - regsensitivity
      - regsen_bounds
      - regsen_breakdown
      - regsen_summary
  - title: "Inference"
    contents:
      - regsen_boot
  - title: "Calibration"
    contents:
      - calibrate_rho
      - calibrate_partial_r2
  - title: "Helpers"
    contents:
      - hypothesis_helpers
  - title: "Visualization"
    contents:
      - plot.regsensitivity
      - theme_regsen
      - scale_colour_regsen
  - title: "Tables and export"
    contents:
      - regsen_table
      - as.data.frame.regsensitivity
  - title: "Data"
    contents:
      - bfg2020
  - title: "Package"
    contents:
      - regsensitivity-package

articles:
  # No `navbar:` key here on purpose. vignettes/regsensitivity.Rmd is
  # auto-promoted to the top-level "Get started" link, so pkgdown drops it
  # from the dropdown; with `navbar: ~` the section still claimed a slot and
  # rendered as an empty row above "Replications". The section stays listed
  # so the vignette still appears on the articles index page.
  - title: "Get started"
    contents:
      - regsensitivity
  # A section only reaches the dropdown if `navbar:` names it. Omitting it
  # is what previously hid both replications behind "More articles...".
  - title: "Replication studies"
    navbar: "Replications"
    contents:
      - dmp2022-replication
      - mp2022-stylized
