# Standard R-CMD-check workflow from r-lib/actions. Bumps with future
# upstream changes automatically because we reference the @v2 tag, not
# pinned shas. CRAN's release / oldrel / devel matrix protects against
# breakage on R upgrades.
on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"   # weekly Monday -- catches dep breakage even without a PR
  workflow_dispatch:

name: R-CMD-check

permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref. Scheduled and
# main-branch runs are never cancelled.
concurrency:
  group: R-CMD-check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    # macOS and Windows check in 2-4 minutes; Linux has historically run
    # 25-40 because nloptr compiles from source on a cold dependency cache.
    # 60 leaves headroom for that while turning an infrastructure hang into
    # a fast red X instead of six hours of billed runner time.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
