# R CMD check under the alternative BLAS/LAPACK libraries CRAN tests with
# as "additional issues". An optimized BLAS moves the last digit or two of
# a result, which a test demanding bit-identical output turns into a
# failure; 0.2.0 failed CRAN's MKL check exactly that way. The R-hub
# containers carry R-devel built against each library.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: alt-BLAS

permissions:
  contents: read

concurrency:
  group: alt-BLAS-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.blas }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        blas: [mkl, atlas]

    container:
      image: ghcr.io/r-hub/containers/${{ matrix.blas }}:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5
      - uses: r-hub/actions/platform-info@v1
      - uses: r-hub/actions/setup-deps@v1
      # Some prebuilt binaries are linked against a BLAS the image does not
      # ship: in November 2026 nloptr's needed libflexiblas.so.3, which the
      # MKL image lacks, so it failed to load before any of this package's
      # code ran. Rebuild those from source; pak also installs what the build
      # needs (cmake for nloptr). Two passes, because a package whose own
      # library is fine still fails to load while a dependency's is broken
      # (lme4 on nloptr), and building it before that dependency fails:
      # first the packages whose shared object cannot be dyn.load()ed, then,
      # in a fresh R process, anything that still does not load.
      - name: Rebuild binaries whose shared objects do not load
        run: |
          R -q -e '
            lib <- .libPaths()[1]
            pk <- rownames(utils::installed.packages(lib.loc = lib))
            so_loads <- function(p) {
              so <- Sys.glob(file.path(lib, p, "libs", "*.so"))
              all(vapply(so, function(f) isTRUE(tryCatch({ dyn.load(f); TRUE }, error = function(e) FALSE)), logical(1)))
            }
            bad <- pk[!vapply(pk, so_loads, logical(1))]
            cat("Shared objects that do not load:", if (length(bad)) bad else "none", "\n")
            if (length(bad)) pak::pkg_install(paste0(bad, "?source"), lib = lib, upgrade = FALSE)
          '
      - name: Rebuild packages that still do not load
        run: |
          R -q -e '
            lib <- .libPaths()[1]
            pk <- rownames(utils::installed.packages(lib.loc = lib))
            loads <- function(p) isTRUE(tryCatch({ loadNamespace(p); TRUE }, error = function(e) FALSE))
            bad <- pk[!vapply(pk, loads, logical(1))]
            cat("Packages that do not load:", if (length(bad)) bad else "none", "\n")
            if (length(bad)) pak::pkg_install(paste0(bad, "?source"), lib = lib, upgrade = FALSE)
          '
      # r-hub/actions/run-check expects a job-config that only R-hub's own
      # dispatcher supplies, so the check is run directly.
      - name: R CMD check --as-cran
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          R -q -e 'if (!requireNamespace("rcmdcheck", quietly = TRUE)) install.packages("rcmdcheck", repos = "https://cloud.r-project.org")'
          R -q -e 'La_library(); extSoftVersion()["BLAS"]'
          R -q -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), build_args = "--no-manual", error_on = "warning", check_dir = "check")'
