# R CMD check under the alternative BLAS/LAPACK libraries CRAN tests with
# as "additional issues". An optimized BLAS moves the last digit or two of
# a result, which a test demanding bit-identical output turns into a
# failure; 0.2.0 failed CRAN's MKL check exactly that way. The R-hub
# containers carry R-devel built against each library.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: alt-BLAS

permissions:
  contents: read

concurrency:
  group: alt-BLAS-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    name: ${{ matrix.blas }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        blas: [mkl, atlas]

    container:
      image: ghcr.io/r-hub/containers/${{ matrix.blas }}:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v5
      - uses: r-hub/actions/platform-info@v1
      - uses: r-hub/actions/setup-deps@v1
      # The dependencies come as binaries built for Fedora's default BLAS,
      # FlexiBLAS. Since November 2026 several of them (nloptr, fracdiff,
      # forecast, ...) link libflexiblas.so.3, which the MKL image does not
      # ship, so they fail to load before any of this package's code runs.
      # Rebuilding them from source is fragile (dependents get built before
      # their dependencies), so install the FlexiBLAS runtime instead. The
      # test is unaffected: regsensitivity has no compiled code, and its
      # linear algebra goes through R's own BLAS, which is still MKL.
      - name: Provide the FlexiBLAS runtime the binaries link against
        run: |
          if ldconfig -p | grep -q 'libflexiblas\.so\.3'; then
            echo "libflexiblas.so.3 present"
          else
            dnf install -y flexiblas
          fi
          R -q -e 'loadNamespace("nloptr"); extSoftVersion()["BLAS"]'
      # r-hub/actions/run-check expects a job-config that only R-hub's own
      # dispatcher supplies, so the check is run directly.
      - name: R CMD check --as-cran
        env:
          _R_CHECK_FORCE_SUGGESTS_: false
        run: |
          R -q -e 'if (!requireNamespace("rcmdcheck", quietly = TRUE)) install.packages("rcmdcheck", repos = "https://cloud.r-project.org")'
          R -q -e 'La_library(); extSoftVersion()["BLAS"]'
          R -q -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), build_args = "--no-manual", error_on = "warning", check_dir = "check")'
