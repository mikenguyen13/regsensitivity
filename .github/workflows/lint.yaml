on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: lint

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare

      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        continue-on-error: true
        with:
          use-public-rspm: true

      # api.r-hub.io, which setup-r queries to resolve an R version, went
      # down three times in one afternoon. Each outage was brief, and each
      # cost a red build and a manual re-run. One automatic retry turns a
      # transient upstream blip into a slower green build. If the service
      # is genuinely down, the second attempt fails and the job fails with
      # it -- this hides a blip, not a real problem.
      - name: Retry R setup after an upstream hiccup
        if: steps.setup-r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr, local::.
          needs: lint

      - name: Lint (informational)
        # Lint findings are reported in the job log but do not fail the
        # workflow. Flip `continue-on-error` to `false` to enforce.
        continue-on-error: true
        run: lintr::lint_package()
        shell: Rscript {0}
