on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions:
  contents: read

concurrency:
  group: pkgdown-${{ github.ref }}
  # Never cancel a run that is about to deploy -- only PR previews.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/prepare

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        id: setup-r
        continue-on-error: true
        with:
          use-public-rspm: true

      # api.r-hub.io, which setup-r queries to resolve an R version, went
      # down three times in one afternoon. Each outage was brief, and each
      # cost a red build and a manual re-run. One automatic retry turns a
      # transient upstream blip into a slower green build. If the service
      # is genuinely down, the second attempt fails and the job fails with
      # it -- this hides a blip, not a real problem.
      - name: Retry R setup after an upstream hiccup
        if: steps.setup-r.outcome == 'failure'
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: docs
